<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS</title>
    <style>
        div#area{
            background-color: red;
            color: white;
            width: 200px;
            height: 200px;
            text-align: center;
            line-height: 190px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1.3em;
        }
    </style>
</head>
<body>
    <div id="area">
        interaja...
    </div>

    <script>
        var a = window.document.getElementById('area')
        a.addEventListener('click', clicar)
        a.addEventListener('mouseenter', entrar)
        a.addEventListener('mouseout', saiu)
        function clicar(){
            a.innerText = 'Clicou'
            a.style.background = 'black'
        }

        function entrar(){
            a.innerText = 'Entrou'
        }

        function saiu(){
            a.innerText = 'Saiu'
            a.style.background = 'red'
        }
    </script>
</body>
</html>
